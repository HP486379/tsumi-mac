name: Verify direct touch controls
on:
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package*.json'
      - '.github/workflows/direct-touch-check.yml'
  push:
    branches: [feature/direct-touch-haptics]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/direct-touch.spec.ts --project=desktop-chromium --project=mobile-chromium
